add_task:
  fields:
    entity_id:
      selector:
        entity:
          integration: thask
          domain: todo
    title:
      required: true
      example: "Reifen wechseln"
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true
    due_granularity:
      selector:
        select:
          translation_key: granularity
          options:
            - day
            - week
            - month
            - quarter
            - year
    due_date:
      selector:
        date:
    due_period:
      example: "X-Block"
      selector:
        text:
    priority:
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box

get_tasks:
  fields:
    entity_id:
      selector:
        entity:
          integration: thask
          domain: todo
    due:
      default: all
      selector:
        select:
          translation_key: due_filter
          options:
            - today
            - this_week
            - this_month
            - overdue
            - all
    view:
      selector:
        select:
          translation_key: view
          options:
            - my_day
            - overdue
            - this_week
            - this_month
            - important
    include_completed:
      default: false
      selector:
        boolean:
    limit:
      selector:
        number:
          min: 1
          max: 100
          mode: box
    compact:
      default: false
      selector:
        boolean:

complete_task:
  fields:
    task_id:
      required: true
      example: 3f1c0d2e9b8a4c7d8e6f5a4b3c2d1e0f
      selector:
        text:
    completed:
      default: true
      selector:
        boolean:

import_tasks:
  fields:
    file:
      required: true
      example: todoist.zip
      selector:
        text:
    format:
      default: auto
      selector:
        select:
          translation_key: import_format
          options:
            - auto
            - todoist
            - google_tasks
            - ticktick
            - csv
            - ical
            - checklist
    list:
      example: Import
      selector:
        text:
    dry_run:
      default: true
      selector:
        boolean:
    include_completed:
      default: true
      selector:
        boolean:

clear_completed:
  fields:
    entity_id:
      selector:
        entity:
          integration: thask
          domain: todo
    older_than_days:
      example: 30
      selector:
        number:
          min: 0
          max: 3650
          unit_of_measurement: d
          mode: box

import_ms_todo:
  fields:
    file:
      default: thask_ms_todo.json
      example: thask_ms_todo.json
      selector:
        text:
    dry_run:
      default: true
      selector:
        boolean:
    include_completed:
      default: true
      selector:
        boolean:
    skip_flagged_emails:
      default: true
      selector:
        boolean:
    convert_month_ends:
      default: false
      selector:
        boolean:
    convert_sundays:
      default: false
      selector:
        boolean:

install_sentences:
  fields:
    languages:
      default:
        - de
        - en
      selector:
        select:
          multiple: true
          options:
            - de
            - en
